name: check

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 全量自检（白话逐字 / 引用编号 / 内核 / 入库端到端）
        run: node selftest.js
      - name: 白话全书产物必须与源一致（改源未重建则失败）
        run: |
          node build_baihua.js
          node check_baihua.js
          git diff --exit-code -- 白话全书 index.html \
            || { echo "::error::产物与源不一致，请本地运行 node build_baihua.js 后提交"; exit 1; }
      - name: 真实问答不得混入仓库
        run: |
          if git ls-files --error-unmatch 问答记录/qa.json 2>/dev/null; then
            echo "::error::问答记录/qa.json 被跟踪，会泄露个人问答"; exit 1;
          fi
          echo "问答记录未跟踪真实数据 ✓"
